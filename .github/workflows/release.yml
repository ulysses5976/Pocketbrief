# 推送版本標籤（例如 v4.3.0）時：先檢查版本號與發布說明，再編譯 Windows 版與 Mac 版，
# 建立 GitHub Release 並附上兩個 zip。發布說明取自 docs/release-notes/<標籤>.md。
# 只更新 Windows 版時：macos/VERSION 不改，就只編 Windows 版，Mac 版沿用上一版 Release 的檔案
# （「最新版」頁面才一直都有 Mac 版可下載）。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read     # 編譯只需要讀；只有 release job 需要寫入

jobs:
  # 先花幾秒檢查，避免兩個平台都編完了才在最後一步失敗
  check:
    runs-on: ubuntu-latest
    outputs:
      mac: ${{ steps.v.outputs.mac }}
    steps:
      - uses: actions/checkout@v4
      - name: Version numbers and release notes
        id: v
        run: |
          tag="$GITHUB_REF_NAME"; ver="${tag#v}"
          notes="docs/release-notes/$tag.md"
          [ -f "$notes" ] || { echo "::error::缺少發布說明 $notes"; exit 1; }
          grep -q "AssemblyVersion(\"$ver.0\")" src/Pocketbrief.cs || { echo "::error::src/Pocketbrief.cs 的 AssemblyVersion 不是 $ver.0"; exit 1; }
          mac="$(tr -d '[:space:]' < macos/VERSION)"
          if [ "$mac" = "$ver" ]; then
            echo "mac=true" >> "$GITHUB_OUTPUT"; echo "Windows 版與 Mac 版：$ver"
          else
            echo "mac=false" >> "$GITHUB_OUTPUT"
            echo "::notice::macos/VERSION 是 $mac：這次只發布 Windows 版 $ver，Mac 版沿用上一版的檔案"
          fi

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Pocketbrief.exe
        shell: cmd
        run: call build.cmd /nopause
      - name: Package
        shell: pwsh
        run: |
          if (-not (Test-Path dist\Pocketbrief.exe)) { throw "build failed" }
          New-Item -ItemType Directory stage | Out-Null
          Copy-Item dist\Pocketbrief.exe, LICENSE, README.md, README.en.md stage
          Copy-Item examples -Recurse stage     # 保留 examples/ 路徑，和 README 的說明一致
          Compress-Archive -Path stage\* -DestinationPath "Pocketbrief-${{ github.ref_name }}-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Pocketbrief-*-windows.zip

  mac:
    needs: check
    if: needs.check.outputs.mac == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build Pocketbrief.app
        run: bash macos/build.sh       # zip 內含 app、LICENSE、README、examples/
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: macos/dist/*.zip

  release:
    needs: [check, windows, mac]
    # mac 被略過（只發布 Windows 版）時照樣發布；任何一個編譯失敗就不發布
    if: ${{ !cancelled() && needs.windows.result == 'success' && (needs.mac.result == 'success' || needs.mac.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 建立 Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Reuse the previous Mac download
        if: needs.check.outputs.mac != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern '*-mac.zip' --dir out   # 不指定標籤＝目前的最新版
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l out
          gh release create "$GITHUB_REF_NAME" out/*.zip \
            --title "口袋句庫 Pocketbrief $GITHUB_REF_NAME" \
            --notes-file "docs/release-notes/$GITHUB_REF_NAME.md" \
            --latest
